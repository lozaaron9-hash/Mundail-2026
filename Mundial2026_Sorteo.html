<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Mundial 2026 — REMAX Norte Agrourbano</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --red: #C8102E; --blue: #003DA5; --dark: #1A1A2E;
  --cream: #F2EFE9; --white: #FFFFFF; --border: #E0DDD8;
  --text: #1A1A2E; --muted: #888899; --shadow: rgba(0,61,165,0.10);
  --green: #1A7A3A; --light-green: #E8F5ED;
  --gold: #B8860B; --light-gold: #FFF8E1;
}
body { background: var(--cream); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }

/* ── HERO ─────────────────────────────────── */
.hero { position: relative; text-align: center; padding: 46px 20px 32px; overflow: hidden; background: var(--white); border-bottom: 3px solid var(--border); }
.hero::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(200,16,46,.07) 0%, transparent 70%),
              radial-gradient(ellipse 60% 40% at 50% 100%, rgba(0,61,165,.05) 0%, transparent 70%);
}
.trophy { font-size: clamp(36px,6vw,64px); display: block; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.hero-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(40px,9vw,90px); letter-spacing: 4px; line-height: 1;
  background: linear-gradient(135deg, var(--red) 0%, var(--blue) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin: 8px 0 4px;
}
.hero-sub { font-family:'Bebas Neue',sans-serif; font-size:clamp(14px,3vw,26px); letter-spacing:8px; color:var(--muted); margin-bottom:16px; }
.hero-badge {
  display:inline-block; background:linear-gradient(135deg,var(--red),#8B0000);
  color:#fff; font-weight:700; font-size:12px; letter-spacing:2px;
  padding:5px 18px; border-radius:20px; text-transform:uppercase;
}

/* ── STATS ────────────────────────────────── */
.stats { display:flex; justify-content:center; flex-wrap:wrap; background:var(--white); border-bottom:2px solid var(--border); }
.stat { text-align:center; padding:18px 28px; border-right:1px solid var(--border); flex:1; min-width:80px; }
.stat:last-child { border-right:none; }
.stat-num { font-family:'Bebas Neue',sans-serif; font-size:34px; line-height:1; }
.c-red  { color:var(--red); }
.c-blue { color:var(--blue); }
.c-grn  { color:var(--green); }
.c-gld  { color:var(--gold); }
.c-muted{ color:#888; }
.stat-label { font-size:10px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-top:3px; }

/* ── TAB NAV ──────────────────────────────── */
.tabs { display:flex; justify-content:center; gap:0; background:var(--white); border-bottom:2px solid var(--border); }
.tab-btn {
  font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:3px;
  padding:16px 36px; cursor:pointer; border:none; background:none;
  color:var(--muted); border-bottom:3px solid transparent; transition:all .2s;
  position:relative; top:2px;
}
.tab-btn:hover { color:var(--dark); }
.tab-btn.active { color:var(--red); border-bottom-color:var(--red); }

/* ── SECTION HEADING ─────────────────────── */
.section-title {
  font-family:'Bebas Neue',sans-serif; font-size:clamp(18px,3.5vw,28px); letter-spacing:3px;
  color:var(--dark); padding:20px 24px 4px; max-width:1400px; margin:0 auto;
  display:flex; align-items:center; gap:12px;
}
.section-title::after { content:''; flex:1; height:2px; background:linear-gradient(90deg,var(--border),transparent); }

/* ── CONTROLS ────────────────────────────── */
.controls { display:flex; align-items:center; justify-content:center; gap:10px; padding:20px 20px 12px; flex-wrap:wrap; }
.search-wrap { position:relative; }
.search-wrap::before { content:'🔍'; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:13px; pointer-events:none; }
input[type=search] {
  background:var(--white); border:1.5px solid var(--border); border-radius:8px;
  color:var(--text); font-size:14px; padding:10px 14px 10px 36px; width:220px;
  outline:none; transition:border-color .2s; box-shadow:0 2px 8px var(--shadow);
}
input[type=search]:focus { border-color:var(--red); }
.filter-btn {
  background:var(--white); border:1.5px solid var(--border); border-radius:8px;
  color:var(--muted); cursor:pointer; font-size:11px; font-weight:700; letter-spacing:1px;
  padding:10px 13px; text-transform:uppercase; transition:all .2s; box-shadow:0 2px 6px var(--shadow);
}
.filter-btn:hover { border-color:var(--blue); color:var(--blue); background:#EEF3FF; }
.filter-btn.active    { border-color:var(--red);   color:#fff; background:var(--red); }
.filter-btn.f-win     { border-color:var(--green);  color:#fff; background:var(--green); }
.filter-btn.f-draw    { border-color:#888;           color:#fff; background:#888; }
.filter-btn.f-live    { border-color:var(--gold);   color:#fff; background:var(--gold); }

/* ── SORTEO GRID ─────────────────────────── */
.sorteo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(275px,1fr)); gap:14px; padding:12px 24px 40px; max-width:1400px; margin:0 auto; }
.scard { background:var(--white); border:1.5px solid var(--border); border-radius:14px; overflow:hidden; transition:transform .2s,box-shadow .2s,border-color .2s; position:relative; box-shadow:0 3px 12px var(--shadow); opacity:0; animation:reveal .4s forwards; }
.scard:hover { transform:translateY(-4px); box-shadow:0 12px 32px rgba(0,61,165,.15); border-color:var(--blue); }
.scard.hidden { display:none; }
.scard-accent { height:4px; }
.scard-body { padding:16px 18px 12px; display:flex; align-items:center; gap:12px; }
.scard-flag { font-size:40px; flex-shrink:0; filter:drop-shadow(0 2px 4px rgba(0,0,0,.15)); }
.scard-info { flex:1; min-width:0; }
.scard-country { font-family:'Bebas Neue',sans-serif; font-size:21px; letter-spacing:1px; line-height:1.1; color:var(--dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.scard-name { font-size:12px; color:var(--muted); margin-top:3px; }
.scard-footer { display:flex; align-items:center; justify-content:space-between; padding:8px 18px 12px; border-top:1px solid var(--border); background:#FAFAF8; }
.scard-rank { font-family:'Bebas Neue',sans-serif; font-size:13px; color:var(--blue); letter-spacing:1px; }
.scard-pts { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:1px; }
.pts-green { color:var(--green); }
.pts-muted { color:#ccc; }
.scard-conf { font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:3px 9px; border-radius:20px; color:#fff; }
.scard-num { position:absolute; top:11px; right:13px; font-family:'Bebas Neue',sans-serif; font-size:13px; color:#CCC; }

.conf-UEFA     { background:#003DA5; }
.conf-CONMEBOL { background:#C8102E; }
.conf-CAF      { background:#8B4513; }
.conf-AFC      { background:#1A6B3A; }
.conf-CONCACAF { background:#6A0DAD; }
.conf-OFC      { background:#007B8A; }
.acc-UEFA      { background:linear-gradient(90deg,#003DA5,#4A7FD4); }
.acc-CONMEBOL  { background:linear-gradient(90deg,#C8102E,#FF4560); }
.acc-CAF       { background:linear-gradient(90deg,#C8860A,#E8A020); }
.acc-AFC       { background:linear-gradient(90deg,#1A6B3A,#2ECC71); }
.acc-CONCACAF  { background:linear-gradient(90deg,#6A0DAD,#9B59B6); }
.acc-OFC       { background:linear-gradient(90deg,#007B8A,#1ABC9C); }

/* ── MATCH GRID ──────────────────────────── */
.match-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:13px; padding:12px 24px 10px; max-width:1400px; margin:0 auto; }
.mcard { background:var(--white); border:1.5px solid var(--border); border-radius:14px; overflow:hidden; transition:transform .2s,box-shadow .2s,border-color .2s; box-shadow:0 3px 12px var(--shadow); opacity:0; animation:reveal .4s forwards; }
.mcard:hover { transform:translateY(-3px); box-shadow:0 10px 28px rgba(0,61,165,.13); border-color:var(--blue); }
.mcard.hidden { display:none; }
.mcard-top { height:4px; }
.top-win  { background:linear-gradient(90deg,#1A7A3A,#2ECC71); }
.top-draw { background:linear-gradient(90deg,#888,#bbb); }
.top-live { background:linear-gradient(90deg,#B8860B,#F0B429); animation:pulse-bar 1.5s ease-in-out infinite alternate; }
@keyframes pulse-bar { from{opacity:.6} to{opacity:1} }
.mcard-header { display:flex; justify-content:space-between; align-items:center; padding:9px 15px 5px; }
.mcard-date { font-size:11px; font-weight:700; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
.mcard-group { font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:2px; color:var(--blue); }
.mcard-score { display:flex; align-items:center; justify-content:space-between; padding:5px 15px 9px; gap:6px; }
.mcard-team { display:flex; flex-direction:column; align-items:center; gap:3px; flex:1; }
.mcard-flag { font-size:32px; line-height:1; filter:drop-shadow(0 2px 4px rgba(0,0,0,.12)); }
.mcard-tname { font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:1px; text-align:center; color:var(--dark); line-height:1.1; }
.mcard-tname.winner { color:var(--green); }
.mcard-tname.loser  { color:var(--muted); }
.score-center { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:60px; }
.score-nums { font-family:'Bebas Neue',sans-serif; font-size:36px; color:var(--dark); letter-spacing:2px; line-height:1; }
.score-sep { color:var(--muted); }
.score-status { font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase; padding:2px 9px; border-radius:12px; }
.s-win  { background:var(--light-green); color:var(--green); }
.s-draw { background:#F0F0F0; color:#666; }
.s-live { background:var(--light-gold); color:var(--gold); animation:blink .9s ease-in-out infinite alternate; }
@keyframes blink { from{opacity:.6} to{opacity:1} }
.mcard-footer { border-top:1px solid var(--border); background:#FAFAF8; padding:8px 15px; display:flex; align-items:center; justify-content:space-between; }
.mcard-pts { font-size:11px; font-weight:700; }
.pts-pos  { color:var(--green); }
.pts-none { color:var(--muted); }
.mcard-owner { font-size:10px; color:var(--muted); text-align:right; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ── WINNERS GRID ────────────────────────── */
.winners-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:13px; padding:12px 24px 36px; max-width:1400px; margin:0 auto; }
.wcard { background:var(--white); border:1.5px solid var(--border); border-radius:14px; overflow:hidden; transition:transform .2s,box-shadow .2s; box-shadow:0 3px 12px var(--shadow); opacity:0; animation:reveal .4s forwards; }
.wcard:hover { transform:translateY(-3px); box-shadow:0 10px 28px rgba(26,122,58,.18); border-color:var(--green); }
.wcard-accent { height:4px; background:linear-gradient(90deg,#1A7A3A,#2ECC71); }
.wcard-body { padding:14px 16px 10px; display:flex; align-items:center; gap:10px; }
.wcard-flag { font-size:36px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.12)); }
.wcard-info { flex:1; }
.wcard-country { font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:1px; color:var(--dark); }
.wcard-owner { font-size:11px; color:var(--muted); margin-top:2px; }
.wcard-pts { font-family:'Bebas Neue',sans-serif; font-size:26px; color:var(--green); line-height:1; }
.wcard-pts-label { font-size:10px; color:var(--muted); letter-spacing:1px; }
.wcard-footer { display:flex; align-items:center; justify-content:space-between; padding:7px 16px 10px; border-top:1px solid var(--border); background:#FAFAF8; }
.wcard-rival { font-size:11px; color:var(--muted); }
.wbadge { font-size:10px; font-weight:700; letter-spacing:1.5px; background:var(--light-green); color:var(--green); padding:3px 9px; border-radius:20px; }

@keyframes reveal { to { opacity:1; } }

/* ── TABS VISIBILITY ─────────────────────── */
.tab-panel { display:none; }
.tab-panel.active { display:block; }

/* ── FOOTER ──────────────────────────────── */
footer { text-align:center; padding:22px 20px; color:var(--muted); font-size:12px; border-top:2px solid var(--border); background:var(--white); letter-spacing:1px; }
footer strong { color:var(--red); }
</style>
</head>

/* ── SORTEO LOGIC ───────────────────────────── */
let activeConf = 'ALL';

function buildSorteo() {
  const grid = document.getElementById('sorteo-grid');
  grid.innerHTML = '';
  sorteoData.forEach((d, i) => {
    const pts = puntosMap[d.country] || 0;
    const card = document.createElement('div');
    card.className = 'scard';
    card.dataset.conf = d.conf;
    card.style.animationDelay = `${i * 25}ms`;
    card.innerHTML = `
      <div class="scard-accent acc-${d.conf}"></div>
      <span class="scard-num">#${d.num}</span>
      <div class="scard-body">
        <span class="scard-flag">${d.flag}</span>
        <div class="scard-info">
          <div class="scard-country">${d.country}</div>
          <div class="scard-name">👤 ${d.name}</div>
        </div>
      </div>
      <div class="scard-footer">
        <span class="scard-rank">📊 FIFA #${d.rank}</span>
        <span class="scard-pts ${pts>0?'pts-green':'pts-muted'}">${pts>0?'⚡ +'+pts+' pts':'· 0 pts'}</span>
        <span class="scard-conf conf-${d.conf}">${d.conf}</span>
      </div>`;
    grid.appendChild(card);
  });
}

function filterCards() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.scard').forEach(c => {
    const text = c.innerText.toLowerCase();
    const confOk = activeConf === 'ALL' || c.dataset.conf === activeConf;
    const textOk = !q || text.includes(q);
    c.classList.toggle('hidden', !(confOk && textOk));
  });
}

function filterConf(conf, btn) {
  activeConf = conf;
  document.querySelectorAll('#panel-sorteo .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterCards();
}

/* ── RESULTS LOGIC ──────────────────────────── */
function buildMatches() {
  const grid = document.getElementById('match-grid');
  grid.innerHTML = '';
  matches.forEach((m, i) => {
    const isWin = m.type==='WIN', isDraw = m.type==='DRAW', isLive = m.type==='LIVE';
    const hW = isWin && m.winner===m.teamH, vW = isWin && m.winner===m.teamV;
    const scoreHTML = isLive
      ? `<span class="score-sep" style="font-size:28px">?&nbsp;·&nbsp;?</span>`
      : `${m.gh}<span class="score-sep" style="font-size:22px;color:var(--muted);margin:0 3px">—</span>${m.gv}`;
    const statusLabel = isLive ? '🔴 EN CURSO' : isWin ? '✓ VICTORIA' : '➖ EMPATE';
    const sClass = isLive ? 's-live' : isWin ? 's-win' : 's-draw';
    const topClass = isLive ? 'top-live' : isWin ? 'top-win' : 'top-draw';
    const ownerLine = isWin
      ? `${m.ownerW} · ${m.ownerL!=='—'?m.ownerL+' elim':'rival sin part.'}`
      : `${m.ownerW!=='—'?m.ownerW:'—'} · ${m.ownerL!=='—'?m.ownerL:'—'}`;
    const card = document.createElement('div');
    card.className = 'mcard'; card.dataset.type = m.type;
    card.style.animationDelay = `${i*22}ms`;
    card.innerHTML = `
      <div class="mcard-top ${topClass}"></div>
      <div class="mcard-header">
        <span class="mcard-date">${m.date}</span>
        <span class="mcard-group">GRUPO ${m.group}</span>
      </div>
      <div class="mcard-score">
        <div class="mcard-team">
          <span class="mcard-flag">${m.flagH}</span>
          <span class="mcard-tname ${hW?'winner':isDraw?'':'loser'}">${m.teamH}</span>
        </div>
        <div class="score-center">
          <div class="score-nums">${scoreHTML}</div>
          <span class="score-status ${sClass}">${statusLabel}</span>
        </div>
        <div class="mcard-team">
          <span class="mcard-flag">${m.flagV}</span>
          <span class="mcard-tname ${vW?'winner':isDraw?'':'loser'}">${m.teamV}</span>
        </div>
      </div>
      <div class="mcard-footer">
        <span class="mcard-pts ${isWin?'pts-pos':'pts-none'}">${isWin?'⚡ +3 pts al ganador':'— sin puntos'}</span>
        <span class="mcard-owner">👥 ${ownerLine}</span>
      </div>`;
    grid.appendChild(card);
  });
}

function buildWinners() {
  const grid = document.getElementById('winners-grid');
  grid.innerHTML = '';
  winners.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'wcard';
    card.style.animationDelay = `${i*30}ms`;
    card.innerHTML = `
      <div class="wcard-accent"></div>
      <div class="wcard-body">
        <span class="wcard-flag">${w.flag}</span>
        <div class="wcard-info">
          <div class="wcard-country">${w.country}</div>
          <div class="wcard-owner">👤 ${w.owner}</div>
        </div>
        <div style="text-align:right">
          <div class="wcard-pts">+${w.pts}</div>
          <div class="wcard-pts-label">PUNTOS</div>
        </div>
      </div>
      <div class="wcard-footer">
        <span class="wcard-rival">vs ${w.rival}</span>
        <span class="wbadge">GRUPO ${w.group}</span>
      </div>`;
    grid.appendChild(card);
  });
}

function filterMatches(type, btn) {
  document.querySelectorAll('#panel-resultados .filter-btn').forEach(b => {
    b.classList.remove('active','f-win','f-draw','f-live');
  });
  if (type==='ALL')  btn.classList.add('active');
  if (type==='WIN')  btn.classList.add('f-win');
  if (type==='DRAW') btn.classList.add('f-draw');
  if (type==='LIVE') btn.classList.add('f-live');
  document.querySelectorAll('.mcard').forEach(c => {
    c.classList.toggle('hidden', type!=='ALL' && c.dataset.type!==type);
  });
}

/* ── TAB SWITCHING ──────────────────────────── */
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
}

/* ── INIT ───────────────────────────────────── */
buildSorteo();
buildMatches();
buildWinners();
</script>
