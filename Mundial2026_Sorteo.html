<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Mundial 2026 — Sorteo Oficina</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --red:     #C8102E;
    --blue:    #003DA5;
    --dark:    #1A1A2E;
    --cream:   #F2EFE9;
    --white:   #FFFFFF;
    --card:    #FFFFFF;
    --border:  #E0DDD8;
    --text:    #1A1A2E;
    --muted:   #888899;
    --shadow:  rgba(0,61,165,0.10);
  }
  body { background: var(--cream); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }

  /* HERO */
  .hero { position: relative; text-align: center; padding: 50px 20px 36px; overflow: hidden; background: var(--white); border-bottom: 3px solid var(--border); }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(200,16,46,.07) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 50% 100%, rgba(0,61,165,.05) 0%, transparent 70%);
    pointer-events: none;
  }



  .trophy { font-size: clamp(40px,7vw,70px); display: block; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  .hero-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(42px,10vw,96px); letter-spacing: 4px; line-height: 1;
    background: linear-gradient(135deg, var(--red) 0%, var(--blue) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin: 10px 0 4px;
  }
  .hero-sub { font-family:'Bebas Neue',sans-serif; font-size:clamp(16px,3.5vw,28px); letter-spacing:8px; color:var(--muted); margin-bottom:18px; }
  .hero-badge {
    display:inline-block;
    background: linear-gradient(135deg, var(--red), #8B0000);
    color:#fff; font-weight:700; font-size:13px; letter-spacing:2px;
    padding:6px 20px; border-radius:20px; text-transform:uppercase;
  }

  /* STATS */
  .stats {
    display:flex; justify-content:center; gap:0; flex-wrap:wrap;
    background: var(--white);
    border-bottom: 2px solid var(--border);
  }
  .stat {
    text-align:center; padding: 20px 40px;
    border-right: 1px solid var(--border);
    flex: 1; min-width: 100px;
  }
  .stat:last-child { border-right: none; }
  .stat-num { font-family:'Bebas Neue',sans-serif; font-size:36px; color:var(--red); line-height:1; }
  .stat-label { font-size:10px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-top:3px; }

  /* CONTROLS */
  .controls { display:flex; align-items:center; justify-content:center; gap:10px; padding:24px 20px 14px; flex-wrap:wrap; }
  .search-wrap { position:relative; }
  .search-wrap::before { content:'🔍'; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; pointer-events:none; }
  input[type=search] {
    background: var(--white); border:1.5px solid var(--border);
    border-radius:8px; color:var(--text); font-size:14px;
    padding:10px 14px 10px 36px; width:240px; outline:none; transition:border-color .2s;
    box-shadow: 0 2px 8px var(--shadow);
  }
  input[type=search]:focus { border-color:var(--red); }
  .filter-btn {
    background: var(--white); border:1.5px solid var(--border); border-radius:8px;
    color:var(--muted); cursor:pointer; font-size:11px; font-weight:700; letter-spacing:1px;
    padding:10px 14px; text-transform:uppercase; transition:all .2s;
    box-shadow: 0 2px 6px var(--shadow);
  }
  .filter-btn:hover { border-color:var(--blue); color:var(--blue); background:#EEF3FF; }
  .filter-btn.active { border-color:var(--red); color:var(--white); background:var(--red); }

  /* GRID */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; padding:16px 24px 60px; max-width:1400px; margin:0 auto; }

  /* CARD */
  .card {
    background: var(--white); border:1.5px solid var(--border); border-radius:14px;
    overflow:hidden; transition:transform .2s, box-shadow .2s, border-color .2s;
    position:relative; box-shadow: 0 3px 12px var(--shadow);
  }
  .card:hover { transform:translateY(-4px); box-shadow:0 12px 32px rgba(0,61,165,.15); border-color:var(--blue); }
  .card-accent { height:4px; width:100%; }
  .card-body { padding:18px 20px 14px; display:flex; align-items:center; gap:14px; }
  .card-flag { font-size:42px; line-height:1; flex-shrink:0; filter:drop-shadow(0 2px 4px rgba(0,0,0,.15)); }
  .card-info { flex:1; min-width:0; }
  .card-country { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:1px; line-height:1.1; color:var(--dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-name { font-size:13px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-footer { display:flex; align-items:center; justify-content:space-between; padding:10px 20px 14px; border-top:1px solid var(--border); background:#FAFAF8; }
  .card-rank { font-family:'Bebas Neue',sans-serif; font-size:13px; color:var(--blue); letter-spacing:1px; }
  .card-conf { font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:3px 10px; border-radius:20px; color:#fff; }
  .card-num { position:absolute; top:12px; right:14px; font-family:'Bebas Neue',sans-serif; font-size:13px; color:#CCC; letter-spacing:1px; }

  .conf-UEFA     { background:#003DA5; }
  .conf-CONMEBOL { background:#C8102E; }
  .conf-CAF      { background:#8B4513; }
  .conf-AFC      { background:#1A6B3A; }
  .conf-CONCACAF { background:#6A0DAD; }
  .conf-OFC      { background:#007B8A; }

  .accent-UEFA     { background:linear-gradient(90deg,#003DA5,#4A7FD4); }
  .accent-CONMEBOL { background:linear-gradient(90deg,#C8102E,#FF4560); }
  .accent-CAF      { background:linear-gradient(90deg,#C8860A,#E8A020); }
  .accent-AFC      { background:linear-gradient(90deg,#1A6B3A,#2ECC71); }
  .accent-CONCACAF { background:linear-gradient(90deg,#6A0DAD,#9B59B6); }
  .accent-OFC      { background:linear-gradient(90deg,#007B8A,#1ABC9C); }

  .card.hidden { display:none; }

  footer {
    text-align:center; padding:24px 20px; color:var(--muted); font-size:12px;
    border-top:2px solid var(--border); background:var(--white);
    letter-spacing: 1px;
  }
  footer strong { color:var(--red); }

  .card { opacity:0; animation:reveal .4s forwards; }
  @keyframes reveal { to { opacity:1; } }
</style>
</head>
<body>

<div class="hero">
  <span class="trophy">🏆</span>
  <h1 class="hero-title">MUNDIAL 2026</h1>
  <p class="hero-sub">Sorteo · Oficina</p>
  <span class="hero-badge">🇺🇸 🇨🇦 🇲🇽 &nbsp;USA · Canada · México</span>
</div>

<div class="stats">
  <div class="stat"><div class="stat-num">40</div><div class="stat-label">Participantes</div></div>
  <div class="stat"><div class="stat-num">48</div><div class="stat-label">Selecciones</div></div>
  <div class="stat"><div class="stat-num">6</div><div class="stat-label">Confederaciones</div></div>
  <div class="stat"><div class="stat-num">2026</div><div class="stat-label">Edición</div></div>
</div>

<div class="controls">
  <div class="search-wrap">
    <input type="search" id="searchInput" placeholder="Buscar nombre o país…" oninput="filterCards()">
  </div>
  <button class="filter-btn active" onclick="filterConf('ALL',this)">Todos</button>
  <button class="filter-btn" onclick="filterConf('UEFA',this)">UEFA</button>
  <button class="filter-btn" onclick="filterConf('CONMEBOL',this)">CONMEBOL</button>
  <button class="filter-btn" onclick="filterConf('CAF',this)">CAF</button>
  <button class="filter-btn" onclick="filterConf('AFC',this)">AFC</button>
  <button class="filter-btn" onclick="filterConf('CONCACAF',this)">CONCACAF</button>
  <button class="filter-btn" onclick="filterConf('OFC',this)">OFC</button>
</div>

<div class="grid" id="grid"></div>

<footer>🏆 Mundial 2026 · USA · Canadá · México · Sorteo de Oficina</footer>

<script>

  {num:40, name:"Diego Bravo",          flag:"🇿🇦", country:"Sudáfrica",         rank:60, conf:"CAF"},
];

let activeConf = 'ALL';

function buildCards(list) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  list.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.conf = d.conf;
    card.style.animationDelay = `${i * 30}ms`;
    card.innerHTML = `
      <div class="card-accent accent-${d.conf}"></div>
      <span class="card-num">#${d.num}</span>
      <div class="card-body">
        <span class="card-flag">${d.flag}</span>
        <div class="card-info">
          <div class="card-country">${d.country}</div>
          <div class="card-name">👤 ${d.name}</div>
        </div>
      </div>
      <div class="card-footer">
        <span class="card-rank">📊 FIFA #${d.rank}</span>
        <span class="card-conf conf-${d.conf}">${d.conf}</span>
      </div>`;
    grid.appendChild(card);
  });
}

function filterCards() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.card').forEach(c => {
    const text = c.innerText.toLowerCase();
    const confMatch = activeConf === 'ALL' || c.dataset.conf === activeConf;
    const textMatch = !q || text.includes(q);
    c.classList.toggle('hidden', !(confMatch && textMatch));
  });
}

function filterConf(conf, btn) {
  activeConf = conf;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterCards();
}

buildCards(data);
</script>
</body>
</html>
