<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Mundial 2026 — Sorteo Oficina</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold:    #F5C518;
    --red:     #C8102E;
    --green:   #006341;
    --dark:    #0A0A0A;
    --mid:     #141414;
    --card:    #1C1C1C;
    --border:  #2E2E2E;
    --text:    #F0F0F0;
    --muted:   #888;
  }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HERO ── */
  .hero {
    position: relative;
    text-align: center;
    padding: 60px 20px 40px;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(197,16,46,.18) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 50% 100%, rgba(0,99,65,.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .trophy { font-size: clamp(48px, 8vw, 80px); display: block; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  .hero-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(42px, 10vw, 100px);
    letter-spacing: 4px;
    line-height: 1;
    background: linear-gradient(135deg, #fff 0%, var(--gold) 50%, #fff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 12px 0 4px;
  }
  .hero-sub {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(18px, 4vw, 32px);
    letter-spacing: 8px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .hero-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--red), #8B0000);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 6px 18px;
    border-radius: 20px;
    text-transform: uppercase;
  }

  /* ── STATS BAR ── */
  .stats {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    padding: 24px 20px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: var(--mid);
  }
  .stat { text-align: center; }
  .stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--gold);
    line-height: 1;
  }
  .stat-label { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 28px 20px 16px;
    flex-wrap: wrap;
  }
  .search-wrap {
    position: relative;
  }
  .search-wrap::before {
    content: '🔍';
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    pointer-events: none;
  }
  input[type=search] {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    padding: 10px 14px 10px 36px;
    width: 240px;
    outline: none;
    transition: border-color .2s;
  }
  input[type=search]:focus { border-color: var(--gold); }

  .filter-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 10px 16px;
    text-transform: uppercase;
    transition: all .2s;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(245,197,24,.07);
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    padding: 16px 24px 60px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: transform .2s, box-shadow .2s, border-color .2s;
    cursor: default;
    position: relative;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0,0,0,.5);
    border-color: var(--gold);
  }
  .card-accent {
    height: 4px;
    width: 100%;
  }
  .card-body {
    padding: 18px 20px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .card-flag {
    font-size: 44px;
    line-height: 1;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.4));
  }
  .card-info { flex: 1; min-width: 0; }
  .card-country {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    line-height: 1.1;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-name {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px 14px;
    border-top: 1px solid var(--border);
  }
  .card-rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 1px;
  }
  .card-conf {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    color: #fff;
  }
  .card-num {
    position: absolute;
    top: 12px; right: 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    color: var(--border);
    letter-spacing: 1px;
  }

  /* conf colors */
  .conf-UEFA     { background: #1a5c2e; }
  .conf-CONMEBOL { background: #7a5c00; }
  .conf-CAF      { background: #8b1a1a; }
  .conf-AFC      { background: #0d4a6b; }
  .conf-CONCACAF { background: #4a1a7a; }
  .conf-OFC      { background: #1a4a4a; }

  .accent-UEFA     { background: linear-gradient(90deg,#2ecc71,#27ae60); }
  .accent-CONMEBOL { background: linear-gradient(90deg,#f1c40f,#e67e22); }
  .accent-CAF      { background: linear-gradient(90deg,#e74c3c,#c0392b); }
  .accent-AFC      { background: linear-gradient(90deg,#3498db,#2980b9); }
  .accent-CONCACAF { background: linear-gradient(90deg,#9b59b6,#8e44ad); }
  .accent-OFC      { background: linear-gradient(90deg,#1abc9c,#16a085); }

  /* hidden */
  .card.hidden { display: none; }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 12px;
    border-top: 1px solid var(--border);
  }

  /* scroll reveal */
  .card { opacity: 0; animation: reveal .4s forwards; }
  @keyframes reveal { to { opacity: 1; } }
</style>
</head>
<body>

<div class="hero">
  <span class="trophy">🏆</span>
  <h1 class="hero-title">MUNDIAL 2026</h1>
  <p class="hero-sub">Sorteo · Oficina</p>
  <span class="hero-badge">🇺🇸 🇨🇦 🇲🇽 &nbsp;USA · Canada · México</span>
</div>

<div class="stats">
  <div class="stat"><div class="stat-num">40</div><div class="stat-label">Participantes</div></div>
  <div class="stat"><div class="stat-num">48</div><div class="stat-label">Selecciones</div></div>
  <div class="stat"><div class="stat-num">6</div><div class="stat-label">Confederaciones</div></div>
  <div class="stat"><div class="stat-num">2026</div><div class="stat-label">Edición</div></div>
</div>

<div class="controls">
  <div class="search-wrap">
    <input type="search" id="searchInput" placeholder="Buscar nombre o país…" oninput="filterCards()">
  </div>
  <button class="filter-btn active" onclick="filterConf('ALL', this)">Todos</button>
  <button class="filter-btn" onclick="filterConf('UEFA', this)">UEFA</button>
  <button class="filter-btn" onclick="filterConf('CONMEBOL', this)">CONMEBOL</button>
  <button class="filter-btn" onclick="filterConf('CAF', this)">CAF</button>
  <button class="filter-btn" onclick="filterConf('AFC', this)">AFC</button>
  <button class="filter-btn" onclick="filterConf('CONCACAF', this)">CONCACAF</button>
  <button class="filter-btn" onclick="filterConf('OFC', this)">OFC</button>
</div>

<div class="grid" id="grid"></div>

<footer>🏆 Mundial 2026 · USA · Canadá · México · Sorteo de Oficina</footer>

  {num:40, name:"Diego Bravo",          flag:"🇿🇦", country:"Sudáfrica",        rank:60, conf:"CAF"},
];

let activeConf = 'ALL';

function buildCards(list) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  list.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = `card`;
    card.dataset.conf = d.conf;
    card.style.animationDelay = `${i * 30}ms`;
    card.innerHTML = `
      <div class="card-accent accent-${d.conf}"></div>
      <span class="card-num">#${d.num}</span>
      <div class="card-body">
        <span class="card-flag">${d.flag}</span>
        <div class="card-info">
          <div class="card-country">${d.country}</div>
          <div class="card-name">👤 ${d.name}</div>
        </div>
      </div>
      <div class="card-footer">
        <span class="card-rank">📊 FIFA #${d.rank}</span>
        <span class="card-conf conf-${d.conf}">${d.conf}</span>
      </div>`;
    grid.appendChild(card);
  });
}

function filterCards() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.card').forEach(c => {
    const text = c.innerText.toLowerCase();
    const confMatch = activeConf === 'ALL' || c.dataset.conf === activeConf;
    const textMatch = !q || text.includes(q);
    c.classList.toggle('hidden', !(confMatch && textMatch));
  });
}

function filterConf(conf, btn) {
  activeConf = conf;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterCards();
}

buildCards(data);
</script>
</body>
</html>
